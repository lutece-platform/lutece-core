<#-- A page template to choose, in the page forms of admin_page_form.html: the label holds its radio button, so that two forms of the same document need no id -->
<label class="lutece-site-template" title="${page_template.description}">
	<input type="radio" class="lutece-site-template-input" name="page_template_id" value="${page_template.id}"<#if checked?has_content> checked</#if>>
	<img src="themes/admin/shared/images/page_templates/${page_template.picture}" alt="" width="40" height="40">
	<span>${page_template.description}</span>
</label>
