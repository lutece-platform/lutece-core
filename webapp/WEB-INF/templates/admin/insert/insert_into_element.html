<!--  Insert service -->
<script>
document.addEventListener("DOMContentLoaded", function() {
const isIt = '${.data_model.input?js_string?no_esc}', insertCode='${insert?js_string?no_esc}';
// An editor other than TinyMCE (Autumn Note) receives the insert through luteceEditorInsert, set by the dialog it opened
if ( parent !== window && parent.luteceEditorInsert ) {
	parent.luteceEditorInsert.insert( insertCode );
	parent.luteceEditorInsert.close( );
	return;
}
switch ( isIt ) {
	case 'slider-file':
		sessionStorage.setItem('slidercode', insertCode );
		window.parent.closeModal( );
		break;
	case 'photo-file':
		var photoUrl = insertCode.match(/("|')(document)((?:\\\1|(?:(?!\1).))*)\1/g);
		sessionStorage.setItem('photourl', photoUrl );
		window.parent.closeModal( );
		break;
	case 'undefined':
		parent.tinymce.activeEditor.insertContent( insertCode );
		parent.tinymce.activeEditor.windowManager.close();
		break;
	case 'null':
		parent.tinymce.activeEditor.insertContent( insertCode );
		parent.tinymce.activeEditor.windowManager.close();
		break;
	case 'tinymce':
		parent.tinymce.activeEditor.insertContent( insertCode );
		parent.tinymce.activeEditor.windowManager.close();
		break;
	// TinyMCE: insert services still pass input=tinymce5, whatever the version of the editor
	case '':
	case 'tinymce5':
		parent.tinymce.activeEditor.insertContent( insertCode );
		parent.tinymce.activeEditor.windowManager.close();
		break;
	default:
		var elementInput = opener.document.getElementById("${.data_model.input?js_string?no_esc}");
		elementInput.value = insertCode;
		window.close();
}
});
</script>
