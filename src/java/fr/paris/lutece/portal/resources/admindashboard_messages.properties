editorProfile.labelDescription=Description
editorProfile.labelEditor=Editor
editorProfile.helpEditor=The profile belongs to this editor for good, and applies while it is the text editor of the back office.
editorProfile.helpEditorFixed=The editor of a profile is chosen at its creation and cannot be changed.
editorProfile.labelPlugins=Plugins
editorProfile.helpPlugins=The profile applies to the pages of these plugins. core stands for the pages of the core.
editorProfile.labelRoles=Roles
editorProfile.helpRoles=Optional: the profile only applies to the users holding one of these roles.
editorProfile.labelWorkgroups=Workgroups
editorProfile.helpWorkgroups=Optional: the profile only applies to the users belonging to one of these workgroups.
editorProfile.labelNoWorkgroup=No workgroup is defined.
editorProfile.labelConfig=Configuration
editorProfile.helpConfig=A JSON object whose options replace the ones of the editor template and of the page, for example { "toolbar": "undo redo | bold italic | lutece | code", "height": 400 }. In a toolbar, lutece is the "Lutece contents" button of all the insert services, luteceImage, lutecePdf, lutecePageLink and luteceNewsletterBlog the button of one insert service, and luteceAll the lutece button followed by those of the insert services of the site. For Autumn Note, the toolbar is a list of button groups, for example [["bold", "italic"], ["luteceAll"]]. For Milkdown, luteceButtons lists the Lutece buttons of the top bar, for example ["lutece", "luteceUploadPdf"], and features turns its features on or off, for example {"table": false}. Empty or {} : the options of the template.
editorProfile.helpDefaultProfile=The default profile of an editor applies to the pages where no other of its profiles matches. Its configuration can be modified, it cannot be removed.
