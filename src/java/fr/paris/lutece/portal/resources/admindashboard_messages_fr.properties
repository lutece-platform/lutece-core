# Profils d\u2019\u00e9diteur (editor_dashboard.html, editor_profile_form.html)
editorProfile.title=Profils d\u2019\u00e9diteur
editorProfile.description=Chaque \u00e9diteur a ses propres profils, ceux de l\u2019\u00e9diteur de texte du back office s\u2019appliquent. Le profil appliqu\u00e9 \u00e0 une page est le premier, dans cet ordre, qui cible le plugin de la page et correspond \u00e0 l\u2019utilisateur. Sinon, le profil par d\u00e9faut de l\u2019\u00e9diteur s\u2019applique.
editorProfile.buttonCreate=Ajouter un profil
editorProfile.buttonMoveUp=Monter
editorProfile.buttonMoveDown=Descendre
editorProfile.labelDefault=Par d\u00e9faut
editorProfile.labelCurrentEditor=\u00c9diteur actif
editorProfile.defaultProfileName=Profil par d\u00e9faut
editorProfile.labelAppliesOtherwise=S\u2019applique quand aucun autre profil de l\u2019\u00e9diteur ne correspond
editorProfile.labelName=Nom
editorProfile.labelDescription=Description
editorProfile.labelEditor=\u00c9diteur
editorProfile.helpEditor=Le profil appartient d\u00e9finitivement \u00e0 cet \u00e9diteur, et s\u2019applique tant qu\u2019il est l\u2019\u00e9diteur de texte du back office.
editorProfile.helpEditorFixed=L\u2019\u00e9diteur d\u2019un profil est choisi \u00e0 sa cr\u00e9ation et ne peut plus \u00eatre chang\u00e9.
editorProfile.labelPlugins=Plugins
editorProfile.helpPlugins=Le profil s\u2019applique aux pages de ces plugins. core d\u00e9signe les pages du c\u0153ur.
editorProfile.labelRoles=R\u00f4les
editorProfile.helpRoles=Facultatif : le profil ne s\u2019applique qu\u2019aux utilisateurs ayant l\u2019un de ces r\u00f4les.
editorProfile.labelWorkgroups=Groupes de travail
editorProfile.helpWorkgroups=Facultatif : le profil ne s\u2019applique qu\u2019aux utilisateurs membres de l\u2019un de ces groupes de travail.
editorProfile.labelNoWorkgroup=Aucun groupe de travail n\u2019est d\u00e9fini.
editorProfile.labelConfig=Configuration
editorProfile.helpConfig=Un objet JSON dont les options remplacent celles du template de l\u2019\u00e9diteur et de la page, par exemple { "toolbar": "undo redo | bold italic | lutece | code", "height": 400 }. Dans une barre d\u2019outils, lutece est le bouton \u00ab Contenus Lutece \u00bb de tous les services d\u2019insertion, luteceImage, lutecePdf, lutecePageLink et luteceNewsletterBlog le bouton d\u2019un seul service d\u2019insertion, et luteceAll le bouton lutece suivi de ceux des services d\u2019insertion du site. Pour Autumn Note, la barre d\u2019outils est une liste de groupes de boutons, par exemple [["bold", "italic"], ["luteceAll"]]. Pour Milkdown, luteceButtons liste les boutons Lutece de la barre du haut, par exemple ["lutece", "luteceUploadPdf"], et features active ou d\u00e9sactive ses fonctions, par exemple {"table": false}. Vide ou {} : les options du template.
editorProfile.helpDefaultProfile=Le profil par d\u00e9faut d\u2019un \u00e9diteur s\u2019applique aux pages o\u00f9 aucun autre de ses profils ne correspond. Sa configuration est modifiable, il ne peut pas \u00eatre supprim\u00e9.
